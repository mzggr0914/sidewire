name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
      - name: Build release
        run: |
          version="$(bash scripts/release-version.sh "$GITHUB_REF_NAME")"
          cargo build --release --locked --target x86_64-pc-windows-msvc -p sidewire
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/sidewire.exe "dist/sidewire-v$version-windows-x86_64.exe"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-windows-x86_64
          if-no-files-found: error
          path: dist/sidewire-v*-windows-x86_64.exe

  linux:
    name: Linux + KernelSU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.2.0
        with:
          version: 12.21.0
          runtime: node@24
          working-directory: webui
          install: false
      - run: test "$(pnpm --version)" = 12.21.0
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: nttld/setup-ndk@v1.6.0
        id: ndk
        with:
          ndk-version: r30
      - name: Rust tooling
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - name: Verify release version
        run: bash scripts/release-version.sh "$GITHUB_REF_NAME"
      - name: Build release
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/release.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-linux-android
          if-no-files-found: error
          path: |
            dist/sidewire-v*-linux-x86_64
            dist/SideWire-KernelSU-v*-arm64.zip

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
      - name: Verify release version
        run: bash scripts/release-version.sh "$GITHUB_REF_NAME"
      - name: Build release
        run: bash ./scripts/release-macos.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/sidewire-v*-macos-${{ matrix.arch }}

  publish:
    name: Publish GitHub Release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v3.0.4
        with:
          name: SideWire ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          fail_on_unmatched_files: true
          files: |
            dist/sidewire-v*-windows-x86_64.exe
            dist/sidewire-v*-linux-x86_64
            dist/sidewire-v*-macos-arm64
            dist/sidewire-v*-macos-x86_64
            dist/SideWire-KernelSU-v*-arm64.zip
            dist/SHA256SUMS

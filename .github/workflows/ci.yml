name: CI

on:
  push:
    branches: [main, master, codex/windows-pty]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.2.0
        with:
          version: 12.21.0
          runtime: node@24
          install: false
      - run: test "$(pnpm --version | tr -d '\r')" = 12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Build script syntax
        if: runner.os == 'Linux'
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  webui:
    name: WebUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.2.0
        with:
          version: 12.21.0
          runtime: node@24
          working-directory: webui
          install: false
      - run: test "$(pnpm --version)" = 12.21.0
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: webui
      - name: Build
        run: pnpm build
        working-directory: webui

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify Android controller line endings
        run: |
          if LC_ALL=C grep -q $'\r' module/bin/sidewirectl; then
            echo "module/bin/sidewirectl must use LF line endings" >&2
            exit 1
          fi
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
      - run: cargo clippy -p sidewire -p sidewire-protocol --all-targets -- -D warnings
      - run: cargo test -p sidewire -p sidewire-protocol
      - run: cargo build --release -p sidewire
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref == 'refs/heads/codex/windows-pty'
        with:
          name: sidewire-windows-x86_64
          if-no-files-found: error
          path: target/release/sidewire.exe

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
      - run: cargo clippy -p sidewire -p sidewire-protocol --all-targets -- -D warnings
      - run: cargo test -p sidewire -p sidewire-protocol
      - run: bash scripts/build.sh --host-only

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
      - run: cargo clippy -p sidewire -p sidewire-protocol --all-targets -- -D warnings
      - run: cargo test -p sidewire -p sidewire-protocol
      - run: bash ./scripts/build-macos.sh

  android:
    name: Android arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.2.0
        with:
          version: 12.21.0
          runtime: node@24
          working-directory: webui
          install: false
      - run: test "$(pnpm --version)" = 12.21.0
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: nttld/setup-ndk@v1.6.0
        id: ndk
        with:
          ndk-version: r30
      - name: Rust Android tooling
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - name: Android clippy
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -P 23 clippy --locked -p sidewired -- -D warnings
      - name: Package KernelSU module
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/release.sh --android-only

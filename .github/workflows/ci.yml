name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          version: 12.3.4
          runtime: node@24
          install: false
      - name: Verify pnpm version
        shell: pwsh
        run: |
          $version = pnpm --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne '12.3.4') {
            throw "Expected pnpm 12.3.4, got $version"
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  webui:
    name: WebUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          version: 12.3.4
          runtime: node@24
          working-directory: webui
          install: false
      - name: Verify pnpm version
        shell: pwsh
        run: |
          $version = pnpm --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne '12.3.4') {
            throw "Expected pnpm 12.3.4, got $version"
          }
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: webui
      - name: Build
        run: pnpm build
        working-directory: webui

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify Android controller line endings
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("module/bin/sidewirectl")
          if ($bytes -contains [byte]13) {
            throw "module/bin/sidewirectl must use LF line endings"
          }
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
      - run: cargo clippy -p sidewire -p sidewire-protocol --all-targets -- -D warnings
      - run: cargo test -p sidewire -p sidewire-protocol
      - run: cargo build --release -p sidewire

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
      - run: cargo clippy -p sidewire -p sidewire-protocol --all-targets -- -D warnings
      - run: cargo test -p sidewire -p sidewire-protocol
      - run: bash ./scripts/build-linux.sh

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
      - run: cargo clippy -p sidewire -p sidewire-protocol --all-targets -- -D warnings
      - run: cargo test -p sidewire -p sidewire-protocol
      - run: bash ./scripts/build-macos.sh

  android:
    name: Android arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
      - name: Rust Android tooling
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - name: Android clippy
        run: cargo ndk -t arm64-v8a -P 23 clippy -p sidewired -- -D warnings
      - name: Module shell syntax
        run: |
          sh -n module/bin/sidewirectl
          sh -n module/action.sh
          sh -n module/customize.sh
          sh -n module/service.sh

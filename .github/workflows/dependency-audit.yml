name: Dependency audit

on:
  schedule:
    - cron: '30 0 * * 1' # Monday at 09:30 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    name: pnpm audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', webui]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3.2.0
        with:
          version: 12.21.0
          runtime: node@24
          working-directory: ${{ matrix.directory }}
          install: false
      - run: pnpm audit --audit-level high
        working-directory: ${{ matrix.directory }}
